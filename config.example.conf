#===============================================================================
# config.example.conf — non-interactive deployment configuration
#
# Copy to e.g. my.conf, edit, then run:
#   sudo bash install-zabbix.sh --config my.conf --non-interactive
#
# Only uncomment the values you want to override.
#===============================================================================

# Zabbix major version (8.0 = latest LTS, recommended for production)
#ZABBIX_VERSION="8.0"

# Database credentials (leave DB_PASSWORD empty to auto-generate a strong one;
# it will be saved to /root/.zabbix-db-password)
#DB_PASSWORD=""
#DB_HOST="localhost"          # localhost = install local MySQL; otherwise remote host
#DB_ROOT_PASSWORD=""          # required only when DB_HOST is a remote host

# Frontend web server: apache | nginx
#WEBSERVER="apache"

# Agent package: zabbix-agent2 (default) | zabbix-agent
#AGENT_PKG="zabbix-agent2"

# Timezone for system and PHP
#TIMEZONE="Asia/Shanghai"

# Firewall: yes = open 80/443/10050/10051 when ufw is active
#OPEN_FIREWALL="yes"
